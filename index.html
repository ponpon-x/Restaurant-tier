<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>Restaurant Tier Boards</title>
<style>
:root{--bg:#f2f2f7;--panel:#fff;--text:#111;--sub:#6e6e73;--line:#d1d1d6;--blue:#007aff;--danger:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif}
body{min-height:100vh}.app{padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 108px)}
h1{font-size:26px;margin:0 0 8px}.boardToolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.boardTabs{display:flex;gap:7px;min-width:max-content}.boardTab{border:0;border-radius:999px;background:#fff;color:var(--text);padding:9px 13px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.boardTab.active{background:var(--blue);color:#fff}.newBoard{border:0;border-radius:999px;background:#eaf3ff;color:var(--blue);padding:9px 12px;font-size:14px;font-weight:750;white-space:nowrap}
.boardActions{display:flex;gap:6px;margin-bottom:10px}.boardActions button{border:0;border-radius:9px;background:#fff;color:#555;padding:7px 10px;font-size:12px;font-weight:650}.boardActions .deleteBoard{color:var(--danger);background:#fff0ef}
.note{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.4}.tierRow{display:grid;grid-template-columns:56px 1fr;gap:8px;background:var(--panel);border-radius:14px;padding:8px 8px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative}
.tierLabel{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:800;border-right:1px solid var(--line);gap:8px}.tierBtns{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.tierBtns button{width:22px;height:22px;border:0;border-radius:6px;background:#f2f2f7;color:#555;font-size:15px;line-height:1;padding:0}.tierBtns .tierDelete{background:#fff0ef;color:var(--danger);font-weight:800}
.canvas{position:relative;min-height:100px;border-radius:10px;background:linear-gradient(to bottom,rgba(0,0,0,.035) 1px,transparent 1px);background-size:100% 36px;overflow:hidden}.resizeHandle{position:absolute;left:64px;right:10px;bottom:3px;height:10px;display:flex;align-items:center;justify-content:center;touch-action:none}.resizeHandle::before{content:"";width:54px;height:4px;border-radius:999px;background:#d1d1d6}
.card{position:absolute;min-width:76px;max-width:180px;min-height:40px;padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:11px;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:14px;font-weight:650;line-height:1.2;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center}.card.dragging{transform:scale(1.03);box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:999}
.headerButtons{display:flex;justify-content:flex-end;margin-bottom:8px}.addTier{border:0;border-radius:10px;background:#eaf3ff;color:var(--blue);font-size:13px;font-weight:700;padding:8px 10px}
.bottomBar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 8px);padding:10px;border-radius:16px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.14);display:grid;grid-template-columns:1fr auto;gap:8px;z-index:1000}
input{height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:16px;outline:none;background:#fff}.addBtn{height:46px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:16px;font-weight:750;padding:0 16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);z-index:3000}.overlay.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:16px;padding:14px}.sheetTitle{text-align:center;font-weight:750;font-size:17px;margin-bottom:4px}.sheetSub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:12px}.actions{display:grid;gap:8px}.actions button{height:46px;border:0;border-radius:11px;font-size:16px;font-weight:700}.danger{background:#fff0ef;color:var(--danger)}.neutral{background:#f2f2f7;color:var(--text)}.help{margin-top:8px;font-size:12px;color:var(--sub);line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <h1>Restaurant Tier Boards</h1>
  <div class="boardToolbar"><div class="boardTabs" id="boardTabs"></div><button class="newBoard" id="newBoardBtn">＋ ボード</button></div>
  <div class="boardActions"><button id="renameBoardBtn">名前変更</button><button class="deleteBoard" id="deleteBoardBtn">ボード削除</button></div>
  <div class="note">ドラッグでTier間・Tier内を自由配置</div>
  <div class="headerButtons"><button class="addTier" id="addTierBtn">＋ Tier</button></div>
  <div id="board"></div>
  <div class="help">ボードごとにTier構成・高さ・店名・位置を別々に保存します。データはこのiPhoneのブラウザ内に保存されます。</div>
</div>
<div class="bottomBar"><input id="nameInput" placeholder="お店の名前" autocomplete="off"><button class="addBtn" id="addBtn">＋ 追加</button></div>
<div class="overlay" id="menu"><div class="sheet"><div class="sheetTitle" id="menuTitle"></div><div class="sheetSub">操作を選んでください</div><div class="actions"><button class="danger" id="deleteBtn">削除</button><button class="neutral" id="cancelBtn">キャンセル</button></div></div></div>
<script>
const STORAGE_KEY="restaurantTierBoards.v4";
const DEFAULT_TIERS=()=>[{label:"1",height:180},{label:"1.5",height:180},{label:"2",height:180},{label:"3",height:180},{label:"4",height:180},{label:"5",height:180}];
let state={activeBoardId:null,boards:[]},drag=null,resize=null,selectedId=null,holdTimer=null,holdStart=null;
const boardEl=document.getElementById("board"),boardTabsEl=document.getElementById("boardTabs"),nameInput=document.getElementById("nameInput"),menu=document.getElementById("menu"),menuTitle=document.getElementById("menuTitle");
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function newBoard(name){return{id:uid(),name,tiers:DEFAULT_TIERS(),items:[]}}
function numericSort(a,b){const na=Number(a.label),nb=Number(b.label);if(!Number.isNaN(na)&&!Number.isNaN(nb))return na-nb;return a.label.localeCompare(b.label,"ja",{numeric:true})}
function activeBoard(){return state.boards.find(b=>b.id===state.activeBoardId)||state.boards[0]}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function migrateOldData(){let oldItems=null,oldTiers=null;try{const ri=localStorage.getItem("restaurantTierBoard.items.v3"),rt=localStorage.getItem("restaurantTierBoard.tiers.v3");if(ri)oldItems=JSON.parse(ri);if(rt)oldTiers=JSON.parse(rt)}catch(e){}
if(!oldItems){try{const r=localStorage.getItem("restaurantTierBoard.v2");if(r)oldItems=JSON.parse(r)}catch(e){}}
if(Array.isArray(oldItems)&&oldItems.length){const migrated=newBoard("既存ボード");migrated.items=oldItems;if(Array.isArray(oldTiers)&&oldTiers.length)migrated.tiers=oldTiers;else{const oldMap={S:"1",A:"2",B:"3",C:"4",D:"5"};for(const item of migrated.items)if(oldMap[item.tier])item.tier=oldMap[item.tier];migrated.tiers=DEFAULT_TIERS();for(const label of [...new Set(migrated.items.map(x=>String(x.tier)))])if(!migrated.tiers.some(t=>t.label===label))migrated.tiers.push({label,height:180});migrated.tiers.sort(numericSort)}
const burger=newBoard("ハンバーガー");state.boards=[migrated,burger];state.activeBoardId=migrated.id;save();return true}return false}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed.boards)&&parsed.boards.length){state=parsed;if(!state.boards.some(b=>b.id===state.activeBoardId))state.activeBoardId=state.boards[0].id;return}}}catch(e){}
if(migrateOldData())return;const ramen=newBoard("ラーメン"),burger=newBoard("ハンバーガー");state.boards=[ramen,burger];state.activeBoardId=ramen.id;save()}
function renderAll(){renderBoardTabs();buildBoard()}
function renderBoardTabs(){boardTabsEl.innerHTML="";for(const b of state.boards){const btn=document.createElement("button");btn.className="boardTab"+(b.id===state.activeBoardId?" active":"");btn.textContent=b.name;btn.onclick=()=>{state.activeBoardId=b.id;save();renderAll()};boardTabsEl.appendChild(btn)}}
function buildBoard(){const b=activeBoard();if(!b)return;boardEl.innerHTML="";for(const tier of b.tiers){const row=document.createElement("div");row.className="tierRow";row.dataset.tier=tier.label;const label=document.createElement("div");label.className="tierLabel";const labelText=document.createElement("div");labelText.textContent=tier.label;const tierBtns=document.createElement("div");tierBtns.className="tierBtns";const minus=document.createElement("button");minus.textContent="−";minus.onclick=()=>changeTierHeight(tier.label,-36);const plus=document.createElement("button");plus.textContent="＋";plus.onclick=()=>changeTierHeight(tier.label,36);const del=document.createElement("button");del.className="tierDelete";del.textContent="×";del.onclick=()=>deleteTier(tier.label);tierBtns.append(minus,plus,del);label.append(labelText,tierBtns);const canvas=document.createElement("div");canvas.className="canvas";canvas.dataset.tier=tier.label;canvas.style.height=Math.max(100,tier.height||180)+"px";const handle=document.createElement("div");handle.className="resizeHandle";handle.addEventListener("pointerdown",e=>startResize(e,tier.label,row));handle.addEventListener("pointermove",moveResize);handle.addEventListener("pointerup",endResize);handle.addEventListener("pointercancel",endResize);row.append(label,canvas,handle);boardEl.appendChild(row)}renderCards()}
function renderCards(){const b=activeBoard();if(!b)return;document.querySelectorAll(".canvas").forEach(c=>c.innerHTML="");for(const item of b.items){const canvas=[...document.querySelectorAll(".canvas")].find(c=>c.dataset.tier===String(item.tier));if(!canvas)continue;const card=makeCard(item);canvas.appendChild(card);requestAnimationFrame(()=>clampCard(item,card,canvas))}}
function makeCard(item){const el=document.createElement("div");el.className="card";el.textContent=item.name;el.dataset.id=item.id;el.style.left=(item.x??8)+"px";el.style.top=(item.y??8)+"px";el.addEventListener("pointerdown",e=>startPointer(e,item,el));el.addEventListener("pointermove",e=>movePointer(e,item,el));el.addEventListener("pointerup",e=>endPointer(e,item,el));el.addEventListener("pointercancel",e=>endPointer(e,item,el));return el}
function startPointer(e,item,el){const rect=el.getBoundingClientRect();drag={id:item.id,el,pointerId:e.pointerId,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,moved:false};holdStart={x:e.clientX,y:e.clientY};el.setPointerCapture?.(e.pointerId);el.classList.add("dragging");clearTimeout(holdTimer);holdTimer=setTimeout(()=>{if(drag&&!drag.moved){selectedId=item.id;menuTitle.textContent=item.name;menu.classList.add("show");navigator.vibrate?.(20)}},650)}
function movePointer(e,item,el){if(!drag||drag.id!==item.id)return;const dx=e.clientX-holdStart.x,dy=e.clientY-holdStart.y;if(Math.hypot(dx,dy)>8){drag.moved=true;clearTimeout(holdTimer)}el.style.pointerEvents="none";const under=document.elementFromPoint(e.clientX,e.clientY);el.style.pointerEvents="";const canvas=under?.closest?.(".canvas");if(!canvas)return;const rect=canvas.getBoundingClientRect();let x=e.clientX-rect.left-drag.offsetX,y=e.clientY-rect.top-drag.offsetY;if(el.parentElement!==canvas){canvas.appendChild(el);item.tier=canvas.dataset.tier}const maxX=Math.max(0,canvas.clientWidth-el.offsetWidth),maxY=Math.max(0,canvas.clientHeight-el.offsetHeight);x=Math.min(Math.max(0,x),maxX);y=Math.min(Math.max(0,y),maxY);el.style.left=x+"px";el.style.top=y+"px";item.x=x;item.y=y}
function endPointer(e,item,el){if(!drag||drag.id!==item.id)return;clearTimeout(holdTimer);holdTimer=null;el.classList.remove("dragging");if(drag.moved)save();drag=null}
function clampCard(item,card,canvas){const maxX=Math.max(0,canvas.clientWidth-card.offsetWidth),maxY=Math.max(0,canvas.clientHeight-card.offsetHeight);item.x=Math.min(Math.max(0,Number(item.x??8)),maxX);item.y=Math.min(Math.max(0,Number(item.y??8)),maxY);card.style.left=item.x+"px";card.style.top=item.y+"px"}
function startResize(e,tierLabel,row){const b=activeBoard(),tier=b.tiers.find(t=>t.label===tierLabel);if(!tier)return;resize={pointerId:e.pointerId,tierLabel,startY:e.clientY,startHeight:tier.height||180,row};e.currentTarget.setPointerCapture?.(e.pointerId);e.preventDefault()}
function moveResize(e){if(!resize||e.pointerId!==resize.pointerId)return;const b=activeBoard(),tier=b.tiers.find(t=>t.label===resize.tierLabel),canvas=resize.row.querySelector(".canvas");if(!tier||!canvas)return;const next=Math.max(100,Math.min(700,resize.startHeight+(e.clientY-resize.startY)));tier.height=Math.round(next);canvas.style.height=tier.height+"px"}
function endResize(e){if(!resize||e.pointerId!==resize.pointerId)return;save();renderCards();resize=null}
function changeTierHeight(label,delta){const b=activeBoard(),tier=b.tiers.find(t=>t.label===label);if(!tier)return;tier.height=Math.max(100,Math.min(700,(tier.height||180)+delta));save();buildBoard()}
function addTier(){const b=activeBoard(),value=prompt("追加するTier名を入力してください","1.5");if(value===null)return;const label=value.trim();if(!label)return;if(b.tiers.some(t=>t.label===label)){alert("そのTierはすでにあります。");return}b.tiers.push({label,height:180});b.tiers.sort(numericSort);save();buildBoard()}
function deleteTier(label){const b=activeBoard();if(b.tiers.length<=1){alert("最後のTierは削除できません。");return}const count=b.items.filter(x=>String(x.tier)===String(label)).length;if(count>0){alert(`Tier ${label} には ${count} 件のお店があります。\n先に別のTierへ移動してください。`);return}if(!confirm(`Tier ${label} を削除しますか？`))return;b.tiers=b.tiers.filter(t=>t.label!==label);save();buildBoard()}
function addShop(){const b=activeBoard(),name=nameInput.value.trim();if(!name)return;const defaultTier=b.tiers.some(t=>t.label==="3")?"3":b.tiers[Math.floor(b.tiers.length/2)].label;const canvas=[...document.querySelectorAll(".canvas")].find(c=>c.dataset.tier===defaultTier);const index=b.items.filter(x=>String(x.tier)===defaultTier).length,x=8+(index%2)*130,y=8+Math.floor(index/2)*48;b.items.push({id:uid(),name,tier:defaultTier,x,y:Math.min(y,(canvas?.clientHeight||180)-48)});nameInput.value="";save();renderCards()}
function deleteSelected(){const b=activeBoard();if(!selectedId||!b)return;b.items=b.items.filter(x=>x.id!==selectedId);selectedId=null;menu.classList.remove("show");save();renderCards()}
function closeMenu(){selectedId=null;menu.classList.remove("show")}
function createBoard(){const name=prompt("新しいボード名","寿司");if(name===null)return;const clean=name.trim();if(!clean)return;const b=newBoard(clean);state.boards.push(b);state.activeBoardId=b.id;save();renderAll()}
function renameBoard(){const b=activeBoard();if(!b)return;const name=prompt("ボード名を変更",b.name);if(name===null)return;const clean=name.trim();if(!clean)return;b.name=clean;save();renderBoardTabs()}
function deleteBoard(){if(state.boards.length<=1){alert("最後のボードは削除できません。");return}const b=activeBoard();if(!b)return;const text=b.items.length?`「${b.name}」を削除しますか？\n登録済みのお店 ${b.items.length} 件も削除されます。`:`「${b.name}」を削除しますか？`;if(!confirm(text))return;const index=state.boards.findIndex(x=>x.id===b.id);state.boards=state.boards.filter(x=>x.id!==b.id);const next=state.boards[Math.min(index,state.boards.length-1)];state.activeBoardId=next.id;save();renderAll()}
document.getElementById("addBtn").addEventListener("click",addShop);document.getElementById("addTierBtn").addEventListener("click",addTier);document.getElementById("newBoardBtn").addEventListener("click",createBoard);document.getElementById("renameBoardBtn").addEventListener("click",renameBoard);document.getElementById("deleteBoardBtn").addEventListener("click",deleteBoard);nameInput.addEventListener("keydown",e=>{if(e.key==="Enter")addShop()});document.getElementById("deleteBtn").addEventListener("click",deleteSelected);document.getElementById("cancelBtn").addEventListener("click",closeMenu);menu.addEventListener("click",e=>{if(e.target===menu)closeMenu()});window.addEventListener("resize",()=>{renderCards();save()});load();renderAll();
</script>
</body>
</html>
