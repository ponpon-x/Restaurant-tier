<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>Restaurant Tier Board</title>
<style>
:root{
  --bg:#f2f2f7; --panel:#fff; --text:#111; --sub:#6e6e73;
  --line:#d1d1d6; --blue:#007aff; --danger:#ff3b30;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;color:var(--text)}
body{min-height:100vh}
.app{padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 104px)}
.headerRow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
h1{font-size:26px;margin:0 0 4px}
.note{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.4}
.addTier{
  border:0;border-radius:10px;background:#eaf3ff;color:var(--blue);
  font-size:14px;font-weight:700;padding:9px 11px;white-space:nowrap
}
.tierRow{
  display:grid; grid-template-columns:52px 1fr; gap:8px;
  background:var(--panel); border-radius:14px; padding:8px 8px 16px; margin-bottom:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.04); position:relative
}
.tierLabel{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:22px; font-weight:800; border-right:1px solid var(--line); gap:8px
}
.sizeBtns{display:flex;gap:3px}
.sizeBtns button{
  width:22px;height:22px;border:0;border-radius:6px;background:#f2f2f7;color:#555;
  font-size:16px;line-height:1;padding:0
}
.tierDelete{
  width:22px;height:22px;border:0;border-radius:6px;
  background:#fff0ef;color:var(--danger);
  font-size:14px;font-weight:800;line-height:1;padding:0
}
.canvas{
  position:relative; min-height:100px; border-radius:10px;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.035) 1px, transparent 1px);
  background-size:100% 36px;
  overflow:hidden;
}
.resizeHandle{
  position:absolute;left:60px;right:10px;bottom:3px;height:10px;
  display:flex;align-items:center;justify-content:center;touch-action:none
}
.resizeHandle::before{
  content:"";width:54px;height:4px;border-radius:999px;background:#d1d1d6
}
.card{
  position:absolute; min-width:76px; max-width:180px;
  min-height:40px; padding:9px 11px;
  border:1px solid var(--line); background:#fff; border-radius:11px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  font-size:14px; font-weight:650; line-height:1.2;
  user-select:none; -webkit-user-select:none; touch-action:none;
  display:flex; align-items:center; justify-content:center; text-align:center;
}
.card.dragging{transform:scale(1.03);box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:999}
.bottomBar{
  position:fixed; left:10px; right:10px;
  bottom:calc(env(safe-area-inset-bottom) + 8px);
  padding:10px; border-radius:16px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 30px rgba(0,0,0,.14);
  display:grid; grid-template-columns:1fr auto; gap:8px; z-index:1000
}
input{
  height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:16px;outline:none;background:#fff
}
.addBtn{
  height:46px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:16px;font-weight:750;padding:0 16px
}
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.35);
  display:none; align-items:flex-end; justify-content:center;
  padding:0 12px calc(env(safe-area-inset-bottom) + 10px); z-index:3000
}
.overlay.show{display:flex}
.sheet{width:min(520px,100%);background:#fff;border-radius:16px;padding:14px}
.sheetTitle{text-align:center;font-weight:750;font-size:17px;margin-bottom:4px}
.sheetSub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:12px}
.actions{display:grid;gap:8px}
.actions button{height:46px;border:0;border-radius:11px;font-size:16px;font-weight:700}
.primary{background:#eef6ff;color:var(--blue)}
.danger{background:#fff0ef;color:var(--danger)}
.neutral{background:#f2f2f7;color:var(--text)}
.help{margin-top:8px;font-size:12px;color:var(--sub);line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <div class="headerRow">
    <div>
      <h1>Restaurant Tier Board</h1>
      <div class="note">店をドラッグで自由配置 / 下のつまみでTierの高さ変更</div>
    </div>
    <button class="addTier" id="addTierBtn">＋ Tier</button>
  </div>

  <div id="board"></div>
  <div class="help">Tierの高さ・追加したTier・店の位置は、このiPhoneのブラウザ内に保存されます。</div>
</div>

<div class="bottomBar">
  <input id="nameInput" placeholder="お店の名前" autocomplete="off">
  <button class="addBtn" id="addBtn">＋ 追加</button>
</div>

<div class="overlay" id="menu">
  <div class="sheet">
    <div class="sheetTitle" id="menuTitle"></div>
    <div class="sheetSub">操作を選んでください</div>
    <div class="actions">
      <button class="danger" id="deleteBtn">削除</button>
      <button class="neutral" id="cancelBtn">キャンセル</button>
    </div>
  </div>
</div>

<script>
const STORAGE_ITEMS = "restaurantTierBoard.items.v3";
const STORAGE_TIERS = "restaurantTierBoard.tiers.v3";
const DEFAULT_TIERS = [
  {label:"1", height:180},
  {label:"1.5", height:180},
  {label:"2", height:180},
  {label:"3", height:180},
  {label:"4", height:180},
  {label:"5", height:180}
];

let tiers = [];
let items = [];
let drag = null;
let resize = null;
let selectedId = null;
let holdTimer = null;
let holdStart = null;

const board = document.getElementById("board");
const nameInput = document.getElementById("nameInput");
const addBtn = document.getElementById("addBtn");
const addTierBtn = document.getElementById("addTierBtn");
const menu = document.getElementById("menu");
const menuTitle = document.getElementById("menuTitle");

function uid(){
  return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function numericSort(a,b){
  const na = Number(a.label), nb = Number(b.label);
  if(!Number.isNaN(na) && !Number.isNaN(nb)) return na - nb;
  return a.label.localeCompare(b.label, "ja", {numeric:true});
}

function load(){
  try{
    const rawT = localStorage.getItem(STORAGE_TIERS);
    tiers = rawT ? JSON.parse(rawT) : structuredClone(DEFAULT_TIERS);
    if(!Array.isArray(tiers) || !tiers.length) tiers = structuredClone(DEFAULT_TIERS);
  }catch(e){
    tiers = structuredClone(DEFAULT_TIERS);
  }

  try{
    let raw = localStorage.getItem(STORAGE_ITEMS);

    // Migration from older versions.
    if(!raw){
      raw = localStorage.getItem("restaurantTierBoard.v2");
    }
    items = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(items)) items = [];

    const oldMap = {S:"1", A:"2", B:"3", C:"4", D:"5"};
    for(const item of items){
      if(oldMap[item.tier]) item.tier = oldMap[item.tier];
      if(!tiers.some(t => t.label === String(item.tier))){
        tiers.push({label:String(item.tier), height:180});
      }
    }
    tiers.sort(numericSort);
    saveAll();
  }catch(e){
    items = [];
  }
}

function saveAll(){
  localStorage.setItem(STORAGE_ITEMS, JSON.stringify(items));
  localStorage.setItem(STORAGE_TIERS, JSON.stringify(tiers));
}

function buildBoard(){
  board.innerHTML = "";

  for(const tier of tiers){
    const row = document.createElement("div");
    row.className = "tierRow";
    row.dataset.tier = tier.label;

    const label = document.createElement("div");
    label.className = "tierLabel";

    const labelText = document.createElement("div");
    labelText.textContent = tier.label;

    const sizeBtns = document.createElement("div");
    sizeBtns.className = "sizeBtns";

    const minus = document.createElement("button");
    minus.textContent = "−";
    minus.onclick = () => changeTierHeight(tier.label, -36);

    const plus = document.createElement("button");
    plus.textContent = "＋";
    plus.onclick = () => changeTierHeight(tier.label, 36);

    const del = document.createElement("button");
    del.className = "tierDelete";
    del.textContent = "×";
    del.title = "Tierを削除";
    del.onclick = () => deleteTier(tier.label);

    sizeBtns.append(minus, plus, del);
    label.append(labelText, sizeBtns);

    const canvas = document.createElement("div");
    canvas.className = "canvas";
    canvas.dataset.tier = tier.label;
    canvas.style.height = Math.max(100, tier.height || 180) + "px";

    const handle = document.createElement("div");
    handle.className = "resizeHandle";
    handle.addEventListener("pointerdown", e => startResize(e, tier.label, row));
    handle.addEventListener("pointermove", moveResize);
    handle.addEventListener("pointerup", endResize);
    handle.addEventListener("pointercancel", endResize);

    row.append(label, canvas, handle);
    board.appendChild(row);
  }

  renderCards();
}

function renderCards(){
  document.querySelectorAll(".canvas").forEach(c => c.innerHTML = "");

  for(const item of items){
    const canvas = [...document.querySelectorAll(".canvas")]
      .find(c => c.dataset.tier === String(item.tier));

    if(!canvas) continue;

    const card = makeCard(item);
    canvas.appendChild(card);
    requestAnimationFrame(() => clampCard(item, card, canvas));
  }
}

function makeCard(item){
  const el = document.createElement("div");
  el.className = "card";
  el.textContent = item.name;
  el.dataset.id = item.id;
  el.style.left = (item.x ?? 8) + "px";
  el.style.top  = (item.y ?? 8) + "px";

  el.addEventListener("pointerdown", e => startPointer(e, item, el));
  el.addEventListener("pointermove", e => movePointer(e, item, el));
  el.addEventListener("pointerup", e => endPointer(e, item, el));
  el.addEventListener("pointercancel", e => endPointer(e, item, el));

  return el;
}

function startPointer(e, item, el){
  const rect = el.getBoundingClientRect();

  drag = {
    id:item.id,
    el,
    pointerId:e.pointerId,
    offsetX:e.clientX - rect.left,
    offsetY:e.clientY - rect.top,
    moved:false
  };

  holdStart = {x:e.clientX,y:e.clientY};
  el.setPointerCapture?.(e.pointerId);
  el.classList.add("dragging");

  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => {
    if(drag && !drag.moved){
      selectedId = item.id;
      menuTitle.textContent = item.name;
      menu.classList.add("show");
      navigator.vibrate?.(20);
    }
  }, 650);
}

function movePointer(e, item, el){
  if(!drag || drag.id !== item.id) return;

  const dx = e.clientX - holdStart.x;
  const dy = e.clientY - holdStart.y;
  if(Math.hypot(dx,dy) > 8){
    drag.moved = true;
    clearTimeout(holdTimer);
  }

  el.style.pointerEvents = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  el.style.pointerEvents = "";
  const canvas = under?.closest?.(".canvas");
  if(!canvas) return;

  const canvasRect = canvas.getBoundingClientRect();
  let x = e.clientX - canvasRect.left - drag.offsetX;
  let y = e.clientY - canvasRect.top - drag.offsetY;

  if(el.parentElement !== canvas){
    canvas.appendChild(el);
    item.tier = canvas.dataset.tier;
  }

  const maxX = Math.max(0, canvas.clientWidth - el.offsetWidth);
  const maxY = Math.max(0, canvas.clientHeight - el.offsetHeight);

  x = Math.min(Math.max(0, x), maxX);
  y = Math.min(Math.max(0, y), maxY);

  el.style.left = x + "px";
  el.style.top = y + "px";

  item.x = x;
  item.y = y;
}

function endPointer(e, item, el){
  if(!drag || drag.id !== item.id) return;

  clearTimeout(holdTimer);
  holdTimer = null;
  el.classList.remove("dragging");

  if(drag.moved) saveAll();
  drag = null;
}

function clampCard(item, card, canvas){
  const maxX = Math.max(0, canvas.clientWidth - card.offsetWidth);
  const maxY = Math.max(0, canvas.clientHeight - card.offsetHeight);

  item.x = Math.min(Math.max(0, Number(item.x ?? 8)), maxX);
  item.y = Math.min(Math.max(0, Number(item.y ?? 8)), maxY);

  card.style.left = item.x + "px";
  card.style.top = item.y + "px";
}

function startResize(e, tierLabel, row){
  const tier = tiers.find(t => t.label === tierLabel);
  if(!tier) return;

  resize = {
    pointerId:e.pointerId,
    tierLabel,
    startY:e.clientY,
    startHeight:tier.height || 180,
    row
  };

  e.currentTarget.setPointerCapture?.(e.pointerId);
  e.preventDefault();
}

function moveResize(e){
  if(!resize || e.pointerId !== resize.pointerId) return;

  const tier = tiers.find(t => t.label === resize.tierLabel);
  const canvas = resize.row.querySelector(".canvas");
  if(!tier || !canvas) return;

  const next = Math.max(100, Math.min(600, resize.startHeight + (e.clientY - resize.startY)));
  tier.height = Math.round(next);
  canvas.style.height = tier.height + "px";
}

function endResize(e){
  if(!resize || e.pointerId !== resize.pointerId) return;

  saveAll();
  renderCards();
  resize = null;
}

function changeTierHeight(label, delta){
  const tier = tiers.find(t => t.label === label);
  if(!tier) return;

  tier.height = Math.max(100, Math.min(600, (tier.height || 180) + delta));
  saveAll();
  buildBoard();
}

function deleteTier(label){
  if(tiers.length <= 1){
    alert("最後のTierは削除できません。");
    return;
  }

  const count = items.filter(x => String(x.tier) === String(label)).length;
  if(count > 0){
    alert(`Tier ${label} には ${count} 件のお店があります。\n先に別のTierへ移動してください。`);
    return;
  }

  const ok = confirm(`Tier ${label} を削除しますか？`);
  if(!ok) return;

  tiers = tiers.filter(t => t.label !== label);
  saveAll();
  buildBoard();
}

function addTier(){
  const value = prompt("追加するTier名を入力してください", "1.5");
  if(value === null) return;

  const label = value.trim();
  if(!label) return;

  if(tiers.some(t => t.label === label)){
    alert("そのTierはすでにあります。");
    return;
  }

  tiers.push({label, height:180});
  tiers.sort(numericSort);
  saveAll();
  buildBoard();
}

function addShop(){
  const name = nameInput.value.trim();
  if(!name) return;

  // New restaurants start in Tier 3 if available, otherwise the middle tier.
  const defaultTier = tiers.some(t => t.label === "3")
    ? "3"
    : tiers[Math.floor(tiers.length/2)].label;

  const canvas = [...document.querySelectorAll(".canvas")]
    .find(c => c.dataset.tier === defaultTier);

  const index = items.filter(x => String(x.tier) === defaultTier).length;
  const x = 8 + (index % 2) * 130;
  const y = 8 + Math.floor(index / 2) * 48;

  items.push({
    id:uid(),
    name,
    tier:defaultTier,
    x,
    y:Math.min(y, (canvas?.clientHeight || 180) - 48)
  });

  nameInput.value = "";
  saveAll();
  renderCards();
}

function deleteSelected(){
  if(!selectedId) return;

  items = items.filter(x => x.id !== selectedId);
  selectedId = null;
  menu.classList.remove("show");
  saveAll();
  renderCards();
}

function closeMenu(){
  selectedId = null;
  menu.classList.remove("show");
}

addBtn.addEventListener("click", addShop);
addTierBtn.addEventListener("click", addTier);

nameInput.addEventListener("keydown", e => {
  if(e.key === "Enter") addShop();
});

document.getElementById("deleteBtn").addEventListener("click", deleteSelected);
document.getElementById("cancelBtn").addEventListener("click", closeMenu);

menu.addEventListener("click", e => {
  if(e.target === menu) closeMenu();
});

window.addEventListener("resize", () => {
  renderCards();
  saveAll();
});

load();
buildBoard();
</script>
</body>
</html>
